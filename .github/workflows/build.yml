name: Build EPUB

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lang: [en, fr, de, es, it, pl, pt]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build EPUB
        run: |
          rm -f *.epub
          python build_magnifica_humanitas_epub.py --lang ${{ matrix.lang }}

      - name: Upload EPUB artifact
        uses: actions/upload-artifact@v4
        with:
          name: magnifica-humanitas-${{ matrix.lang }}
          path: "*.epub"
          if-no-files-found: error
