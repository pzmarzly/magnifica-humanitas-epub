name: Build EPUB

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lang: [en, fr, de, es, it, pl, pt]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build EPUB
        run: |
          rm -f *.epub
          python build_magnifica_humanitas_epub.py --lang ${{ matrix.lang }}

      - name: Upload EPUB artifact
        uses: actions/upload-artifact@v4
        with:
          name: magnifica-humanitas-${{ matrix.lang }}
          path: "*.epub"
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built EPUBs
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish rolling latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          files: artifacts/*.epub
